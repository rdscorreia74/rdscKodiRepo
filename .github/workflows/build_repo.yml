name: Build Kodi Repository

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Checkout LegendasDivX Addon Code
        uses: actions/checkout@v4
        with:
          repository: 'rdscorreia74/service.subtitles.legendasdivx'
          ref: 'Matrix'
          path: 'service.subtitles.legendasdivx'

      - name: Generate Kodi Repo Files
        run: |
          mkdir -p public/service.subtitles.legendasdivx
          mkdir -p public/repository.rdscKodiRepo

          # Zip the LegendasDivX addon
          zip -r public/service.subtitles.legendasdivx/service.subtitles.legendasdivx-1.0.7.zip service.subtitles.legendasdivx -x "*.git*"

          # Zip the repository addon
          zip -r public/repository.rdscKodiRepo/repository.rdscKodiRepo-1.0.0.zip repository.rdscKodiRepo -x "*.git*"

          # Build addons.xml properly with Python
          python3 -c "
          import xml.etree.ElementTree as ET

          root = ET.Element('addons')
          for path in ['repository.rdscKodiRepo/addon.xml', 'service.subtitles.legendasdivx/addon.xml']:
              tree = ET.parse(path)
              root.append(tree.getroot())

          tree = ET.ElementTree(root)
          ET.indent(tree, space='  ')
          tree.write('public/addons.xml', encoding='utf-8', xml_declaration=True)
          "

          # Copy repository zip to root so Kodi and web root can access it directly
          cp public/repository.rdscKodiRepo/repository.rdscKodiRepo-1.0.0.zip public/
          cp index.html public/index.html

          # Generate Hash
          md5sum < public/addons.xml | cut -d ' ' -f 1 > public/addons.xml.md5

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
