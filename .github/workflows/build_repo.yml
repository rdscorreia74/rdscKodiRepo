name: Build Kodi Repository

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Kodi Repo
        uses: drinfernoo/create-kodi-repo@v10
        with:
          gh_pages: true
