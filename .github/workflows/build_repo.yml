name: Build Kodi Repository

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout LegendasDivX Addon
        uses: actions/checkout@v4
        with:
          repository: 'rdscorreia74/service.subtitles.legendasdivx'
          ref: 'Matrix'
          path: 'service.subtitles.legendasdivx'

      - name: Generate Kodi Repo Files
        run: |
          mkdir -p public/service.subtitles.legendasdivx
          mkdir -p public/repository.rdscKodiRepo

          # Extract version dynamically from addon.xml
          ADDON_VER=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('service.subtitles.legendasdivx/addon.xml').getroot().attrib['version'])")
          REPO_VER=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('repository.rdscKodiRepo/addon.xml').getroot().attrib['version'])")

          # Zip LegendasDivX addon using extracted version
          zip -r "public/service.subtitles.legendasdivx/service.subtitles.legendasdivx-${ADDON_VER}.zip" service.subtitles.legendasdivx -x "*.git*"

          # Copy icon/fanart to public directory if present
          [ -f service.subtitles.legendasdivx/icon.png ] && cp service.subtitles.legendasdivx/icon.png public/service.subtitles.legendasdivx/ || true
          [ -f service.subtitles.legendasdivx/fanart.jpg ] && cp service.subtitles.legendasdivx/fanart.jpg public/service.subtitles.legendasdivx/ || true

          # Zip repository addon using extracted version
          zip -r "public/repository.rdscKodiRepo/repository.rdscKodiRepo-${REPO_VER}.zip" repository.rdscKodiRepo -x "*.git*"

          # Build addons.xml properly with Python
          python3 -c "
          import xml.etree.ElementTree as ET

          root = ET.Element('addons')
          for path in ['repository.rdscKodiRepo/addon.xml', 'service.subtitles.legendasdivx/addon.xml']:
              tree = ET.parse(path)
              root.append(tree.getroot())

          tree = ET.ElementTree(root)
          ET.indent(tree, space='  ')
          tree.write('public/addons.xml', encoding='utf-8', xml_declaration=True)
          "

          # Copy repository zip and assets to public root
          cp "public/repository.rdscKodiRepo/repository.rdscKodiRepo-${REPO_VER}.zip" public/repository.rdscKodiRepo-1.0.0.zip
          cp index.html public/index.html

          # Generate Hash
          md5sum < public/addons.xml | cut -d ' ' -f 1 > public/addons.xml.md5

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
